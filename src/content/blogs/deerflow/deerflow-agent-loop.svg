<?xml version="1.0" encoding="UTF-8"?>
<svg width="880" height="504" viewBox="0 0 880 504" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="deerflow-agent-loop-title deerflow-agent-loop-desc" id="deerflow-agent-loop-root">
        <title id="deerflow-agent-loop-title">Lead Agent 的执行循环</title>
        <desc id="deerflow-agent-loop-desc">create_agent 生成的模型与工具循环被 DeerFlow 的 middleware 链包住，工具调用落到 Sandbox、MCP 或子 Agent，每一步状态合并进 ThreadState 并写入 checkpoint，没有工具调用时输出最终回答。</desc>
        <defs>
      <style>#deerflow-agent-loop-root { --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75; --color-accent: #bf4520;
      --font-sans: 'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif; --font-serif: 'Instrument Serif', 'Noto Serif', serif; --font-mono: 'Geist Mono', ui-monospace, monospace; }
      #deerflow-agent-loop-root { font-family: var(--font-sans); color: var(--color-ink); }
      #deerflow-agent-loop-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#deerflow-agent-loop-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="deerflow-agent-loop-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="deerflow-agent-loop-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- ============ Middleware container ============ -->
        <rect x="208" y="88" width="384" height="160" rx="8" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <text x="220" y="108" fill="#5a6580" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', sans-serif">Middleware 链：包住每一次模型调用和工具调用</text>

        <!-- ============ Arrows ============ -->
        <line x1="184" y1="160" x2="230" y2="160" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#deerflow-agent-loop-arrow)"/>
        <line x1="376" y1="148" x2="422" y2="148" stroke="#bf4520" stroke-width="1.4" marker-end="url(#deerflow-agent-loop-arrow-accent)"/>
        <line x1="424" y1="172" x2="378" y2="172" stroke="#bf4520" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#deerflow-agent-loop-arrow-accent)"/>
        <line x1="304" y1="188" x2="304" y2="298" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#deerflow-agent-loop-arrow)"/>
        <path d="M 568 148 L 598 148 Q 604 148 604 142 L 604 102 Q 604 96 610 96 L 662 96" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#deerflow-agent-loop-arrow)"/>
        <line x1="568" y1="160" x2="662" y2="160" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#deerflow-agent-loop-arrow)"/>
        <path d="M 568 172 L 598 172 Q 604 172 604 178 L 604 218 Q 604 224 610 224 L 662 224" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#deerflow-agent-loop-arrow)"/>
        <line x1="528" y1="248" x2="528" y2="374" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#deerflow-agent-loop-arrow)"/>

        <!-- labels -->
        <rect x="382" y="126" width="36" height="16" rx="2" fill="#f5f5f5"/>
        <text x="400" y="138" fill="#bf4520" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', sans-serif" text-anchor="middle">调工具</text>
        <rect x="384" y="178" width="32" height="16" rx="2" fill="#f5f5f5"/>
        <text x="400" y="190" fill="#bf4520" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', sans-serif" text-anchor="middle">结果</text>
        <rect x="312" y="256" width="100" height="16" rx="2" fill="#f5f5f5"/>
        <text x="316" y="268" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', sans-serif">无 tool_calls</text>
        <rect x="536" y="300" width="84" height="16" rx="2" fill="#f5f5f5"/>
        <text x="540" y="312" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', sans-serif">每步合并写入</text>

        <!-- ============ Nodes ============ -->
        <rect x="24" y="132" width="160" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="24" y="132" width="160" height="56" rx="6" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/>
        <text x="104" y="156" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', sans-serif" text-anchor="middle">checkpoint + 新消息</text>
        <text x="104" y="174" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">thread_id</text>

        <rect x="232" y="132" width="144" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="232" y="132" width="144" height="56" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <text x="304" y="156" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', sans-serif" text-anchor="middle">模型调用</text>
        <text x="304" y="174" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">AIMessage</text>

        <rect x="424" y="132" width="144" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="424" y="132" width="144" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="496" y="156" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', sans-serif" text-anchor="middle">工具执行</text>
        <text x="496" y="174" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">ToolMessage</text>

        <rect x="664" y="72" width="192" height="48" rx="6" fill="#f5f5f5"/>
        <rect x="664" y="72" width="192" height="48" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1.2" stroke-dasharray="4,4" fill-opacity="0.05" stroke-opacity="0.50"/>
        <text x="760" y="92" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', sans-serif" text-anchor="middle">Sandbox</text>
        <text x="760" y="108" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">files · bash · per-thread dir</text>

        <rect x="664" y="136" width="192" height="48" rx="6" fill="#f5f5f5"/>
        <rect x="664" y="136" width="192" height="48" rx="6" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <text x="760" y="156" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', sans-serif" text-anchor="middle">MCP / 内置 / 社区工具</text>
        <text x="760" y="172" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">search · fetch · ...</text>

        <rect x="664" y="200" width="192" height="48" rx="6" fill="#f5f5f5"/>
        <rect x="664" y="200" width="192" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="760" y="220" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', sans-serif" text-anchor="middle">Sub-Agent</text>
        <text x="760" y="236" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">task → own agent loop</text>

        <rect x="232" y="300" width="144" height="48" rx="6" fill="#f5f5f5"/>
        <rect x="232" y="300" width="144" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="304" y="320" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', sans-serif" text-anchor="middle">最终回答</text>
        <text x="304" y="336" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">END</text>

        <rect x="208" y="376" width="384" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="208" y="376" width="384" height="56" rx="6" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <text x="400" y="400" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', sans-serif" text-anchor="middle">ThreadState → checkpoint</text>
        <text x="400" y="418" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">messages · todos · artifacts · summary_text · delegations</text>

        <!-- ============ Legend ============ -->
        <line x1="24" y1="456" x2="856" y2="456" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
        <rect x="24" y="474" width="16" height="12" rx="2" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <text x="48" y="484" fill="#4f5d75" font-size="12" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', sans-serif">DeerFlow 策略层</text>
        <line x1="168" y1="480" x2="196" y2="480" stroke="#bf4520" stroke-width="1.4" marker-end="url(#deerflow-agent-loop-arrow-accent)"/>
        <text x="204" y="484" fill="#4f5d75" font-size="12" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', sans-serif">create_agent() 生成的循环</text>
        <rect x="380" y="474" width="16" height="12" rx="2" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <text x="404" y="484" fill="#4f5d75" font-size="12" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', sans-serif">LangGraph 状态</text>
        <rect x="516" y="474" width="16" height="12" rx="2" fill="#bf4520" stroke="#bf4520" stroke-width="1" stroke-dasharray="4,4" fill-opacity="0.05" stroke-opacity="0.50"/>
        <text x="540" y="484" fill="#4f5d75" font-size="12" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', sans-serif">隔离执行环境</text>
      </svg>
