<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 696" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="deerflow-run-sequence-title deerflow-run-sequence-desc" id="deerflow-run-sequence-root">
        <title id="deerflow-run-sequence-title">一次网页对话的完整链路</title>
        <desc id="deerflow-run-sequence-desc">前端提交 run，Gateway 鉴权登记后立刻建立 SSE 并在后台启动 run_agent；worker 恢复 checkpoint、驱动 graph 的模型工具循环、每步写 checkpoint 并把增量推给前端；结束时写 run 终态，长期记忆异步入队。</desc>
        <defs>
      <style>#deerflow-run-sequence-root { --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75; --color-accent: #bf4520;
      --font-sans: 'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif; --font-serif: 'Instrument Serif', 'Noto Serif', serif; --font-mono: 'Geist Mono', ui-monospace, monospace; }
      #deerflow-run-sequence-root { font-family: var(--font-sans); color: var(--color-ink); }
      #deerflow-run-sequence-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#deerflow-run-sequence-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="deerflow-run-sequence-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="deerflow-run-sequence-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="deerflow-run-sequence-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
          <marker id="deerflow-run-sequence-arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Lifelines: 112, 312, 512, 712, 896 -->
        <line x1="112" y1="128" x2="112" y2="616" stroke="#2d3142" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.22"/>
        <line x1="312" y1="128" x2="312" y2="616" stroke="#2d3142" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.22"/>
        <line x1="512" y1="128" x2="512" y2="616" stroke="#2d3142" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.22"/>
        <line x1="712" y1="128" x2="712" y2="616" stroke="#2d3142" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.22"/>
        <line x1="896" y1="128" x2="896" y2="616" stroke="#2d3142" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.22"/>

        <!-- Phase gutter -->
        <text x="16" y="164" fill="#5a6580" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', sans-serif">接入</text>
        <text x="16" y="320" fill="#5a6580" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', sans-serif">执行</text>
        <text x="16" y="532" fill="#5a6580" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', sans-serif">收尾</text>
        <line x1="16" y1="300" x2="984" y2="300" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
        <line x1="16" y1="512" x2="984" y2="512" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>

        <!-- Activation bars -->
        <rect x="308" y="176" width="8" height="104" fill="#2d3142" stroke="#4f5d75" stroke-width="0.8" fill-opacity="0.06"/>
        <rect x="508" y="248" width="8" height="352" fill="#2d3142" stroke="#4f5d75" stroke-width="0.8" fill-opacity="0.06"/>
        <rect x="708" y="356" width="8" height="80" fill="#2d3142" stroke="#4f5d75" stroke-width="0.8" fill-opacity="0.06"/>

        <!-- Messages -->
        <line x1="112" y1="176" x2="306" y2="176" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#deerflow-run-sequence-arrow-link)"/>
        <path d="M 316 200 L 352 200 L 352 228 L 320 228" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#deerflow-run-sequence-arrow)"/>
        <line x1="316" y1="252" x2="506" y2="252" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#deerflow-run-sequence-arrow-open)"/>
        <line x1="308" y1="276" x2="114" y2="276" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#deerflow-run-sequence-arrow)"/>
        <line x1="516" y1="324" x2="894" y2="324" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#deerflow-run-sequence-arrow)"/>
        <line x1="516" y1="356" x2="706" y2="356" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#deerflow-run-sequence-arrow)"/>
        <path d="M 716 376 L 752 376 L 752 404 L 720 404" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#deerflow-run-sequence-arrow)"/>
        <line x1="716" y1="432" x2="894" y2="432" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#deerflow-run-sequence-arrow)"/>
        <line x1="508" y1="476" x2="114" y2="476" stroke="#bf4520" stroke-width="1.4" marker-end="url(#deerflow-run-sequence-arrow-accent)"/>
        <line x1="516" y1="540" x2="894" y2="540" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#deerflow-run-sequence-arrow)"/>
        <line x1="516" y1="584" x2="894" y2="584" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#deerflow-run-sequence-arrow-open)"/>

        <!-- Labels -->
        <rect x="160" y="160" width="104" height="12" rx="2" fill="#f5f5f5"/>
        <text x="212" y="169" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">POST RUNS/STREAM</text>

        <rect x="360" y="206" width="136" height="16" rx="2" fill="#f5f5f5"/>
        <text x="364" y="218" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', sans-serif">鉴权，登记 RunRecord</text>

        <rect x="380" y="230" width="64" height="16" rx="2" fill="#f5f5f5"/>
        <text x="412" y="242" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', sans-serif" text-anchor="middle">后台 task</text>

        <rect x="148" y="254" width="128" height="16" rx="2" fill="#f5f5f5"/>
        <text x="212" y="266" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', sans-serif" text-anchor="middle">run 已接受，SSE 开流</text>

        <rect x="756" y="302" width="96" height="16" rx="2" fill="#f5f5f5"/>
        <text x="804" y="314" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', sans-serif" text-anchor="middle">读 checkpoint</text>

        <rect x="560" y="340" width="104" height="12" rx="2" fill="#f5f5f5"/>
        <text x="612" y="349" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">ASTREAM(INPUT)</text>

        <rect x="760" y="382" width="100" height="16" rx="2" fill="#f5f5f5"/>
        <text x="764" y="394" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', sans-serif">模型 ↔ 工具循环</text>

        <rect x="744" y="410" width="120" height="16" rx="2" fill="#f5f5f5"/>
        <text x="804" y="422" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', sans-serif" text-anchor="middle">每步写 checkpoint</text>

        <rect x="148" y="454" width="128" height="16" rx="2" fill="#f5f5f5"/>
        <text x="212" y="466" fill="#bf4520" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', sans-serif" text-anchor="middle">SSE 增量事件</text>
        <rect x="360" y="454" width="104" height="16" rx="2" fill="#f5f5f5"/>
        <text x="412" y="466" fill="#4f5d75" font-size="12" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', sans-serif" text-anchor="middle">经 StreamBridge</text>

        <rect x="560" y="518" width="104" height="16" rx="2" fill="#f5f5f5"/>
        <text x="612" y="530" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', sans-serif" text-anchor="middle">run 终态 + 事件</text>

        <rect x="560" y="562" width="104" height="16" rx="2" fill="#f5f5f5"/>
        <text x="612" y="574" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', sans-serif" text-anchor="middle">记忆入队（异步）</text>

        <!-- Actors -->
        <rect x="32" y="72" width="160" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="32" y="72" width="160" height="56" rx="6" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/>
        <text x="112" y="96" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', sans-serif" text-anchor="middle">前端</text>
        <text x="112" y="114" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">useStream · via Nginx</text>

        <rect x="232" y="72" width="160" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="232" y="72" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="312" y="96" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', sans-serif" text-anchor="middle">Gateway 路由</text>
        <text x="312" y="114" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">start_run · RunManager</text>

        <rect x="432" y="72" width="160" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="432" y="72" width="160" height="56" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <text x="512" y="96" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', sans-serif" text-anchor="middle">Worker</text>
        <text x="512" y="114" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">run_agent() · same process</text>

        <rect x="632" y="72" width="160" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="632" y="72" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="712" y="96" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', sans-serif" text-anchor="middle">Lead Agent graph</text>
        <text x="712" y="114" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">middleware · tools · sandbox</text>

        <rect x="832" y="72" width="136" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="832" y="72" width="136" height="56" rx="6" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <text x="900" y="96" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', sans-serif" text-anchor="middle">持久化</text>
        <text x="900" y="114" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">checkpoint · runs · memory</text>

        <!-- Legend -->
        <line x1="16" y1="636" x2="984" y2="636" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
        <line x1="16" y1="664" x2="44" y2="664" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#deerflow-run-sequence-arrow-link)"/>
        <text x="52" y="668" fill="#4f5d75" font-size="12" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', sans-serif">HTTP 请求</text>
        <line x1="140" y1="664" x2="168" y2="664" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#deerflow-run-sequence-arrow-open)"/>
        <text x="176" y="668" fill="#4f5d75" font-size="12" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', sans-serif">异步，不等待</text>
        <line x1="276" y1="664" x2="304" y2="664" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#deerflow-run-sequence-arrow)"/>
        <text x="312" y="668" fill="#4f5d75" font-size="12" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', sans-serif">返回</text>
        <line x1="364" y1="664" x2="392" y2="664" stroke="#bf4520" stroke-width="1.4" marker-end="url(#deerflow-run-sequence-arrow-accent)"/>
        <text x="400" y="668" fill="#4f5d75" font-size="12" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', sans-serif">用户看到的流式输出</text>
        <rect x="560" y="658" width="16" height="12" rx="2" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <text x="584" y="668" fill="#4f5d75" font-size="12" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', sans-serif">Agent 实际执行处（与 Gateway 同进程）</text>
      </svg>
